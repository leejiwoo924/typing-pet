# Mac 배포 파일 자동 빌드 (Windows만 있어도 가능)
# GitHub에 올린 뒤 Actions → Build Mac → Run workflow

name: Build Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build dmg/zip
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_IDENTITY: 'null'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typing-pet-mac-0.2.0
          path: |
            mac/배포/**
            mac/release/*.dmg
            mac/release/*.zip
          if-no-files-found: error
