# Mac 배포 파일 자동 빌드 (Windows만 있어도 가능)
# GitHub에 올린 뒤 Actions → Build Mac → Run workflow
#
# 서명/공증(권장): Repo Settings → Secrets 에 아래를 넣으면 double-click 실행 가능
#   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# Secrets 없으면 unsigned 빌드 (받는 Mac에서 quarantine 제거 필요)

name: Build Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build dmg/zip
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${CSC_LINK}" ]; then
            echo "::notice::UNSIGNED build — users must open ★먼저-이것만-실행.command inside TypingPet-*-Mac-열기.zip (not the .app)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "CSC_LINK present — Developer ID signing enabled"
          fi
          npm run dist:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typing-pet-mac-0.2.0
          path: |
            mac/배포/TypingPet-*-Mac-열기.zip
            mac/배포/사용설명서.txt
            mac/배포/**
            mac/release/*.dmg
            mac/release/*.zip
          if-no-files-found: error
